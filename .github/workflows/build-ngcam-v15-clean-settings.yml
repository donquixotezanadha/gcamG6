name: NGCam Lite 2 Build 15 - clean settings, HDR+ fixed on, AWB off (G6)

on:
  push:
    branches:
      - build-15-clean-settings
    paths:
      - .github/workflows/build-ngcam-v15-clean-settings.yml
      - patches/build15_patch.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0

      - name: Install Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o /tmp/apktool.jar
          sudo mv /tmp/apktool.jar /usr/local/lib/apktool.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/lib/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool

      - name: Download and verify original APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/donquixotezanadha/gcamG6/releases/download/original-v1/NGCam.lite2.apk" -o original.apk
          echo "cfb6650043835837e0f89ed2565c3f9df331b8e8f967a61366fe56c5f56f1087  original.apk" | sha256sum -c

      - name: Decode original APK (Smali only, original resources untouched)
        run: apktool d -f -r original.apk -o decoded

      - name: Apply Build 15 patches
        run: python3 patches/build15_patch.py decoded

      - name: Build APK
        run: apktool b decoded -o unsigned.apk

      - name: Align and sign with the fixed key
        shell: bash
        run: |
          set -euo pipefail
          OUT=NGCam-Lite2-Build15-Clean-Settings
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 unsigned.apk $OUT-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks patches/ngcam-g6.jks --ks-pass pass:ngcamg6keep --key-pass pass:ngcamg6keep \
            --out $OUT.apk $OUT-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose $OUT.apk
          sha256sum $OUT.apk > SHA256SUMS.txt
          {
            cat patch-report.txt
            echo
            echo "Base: Build 14b + Lib Patcher, HDR+ Enhanced Frames, Photo resolution hidden; HDR+ control off (HDR+ always on); Google AWB off."
            echo "Signed with the FIXED key patches/ngcam-g6.jks, so later builds update this one in place."
            echo "First install of this build still needs the old APK uninstalled (different signing key)."
            echo
            cat SHA256SUMS.txt
          } > BUILD-NOTES.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NGCam-Lite2-Build15-Clean-Settings
          path: |
            NGCam-Lite2-Build15-Clean-Settings.apk
            BUILD-NOTES.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

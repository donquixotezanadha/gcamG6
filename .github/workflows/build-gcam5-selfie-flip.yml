name: GCam 5.1 - Selfie Flip (auto mirror front camera)

on:
  push:
    branches:
      - gcam5-selfie-flip
    paths:
      - .github/workflows/build-gcam5-selfie-flip.yml
      - patches/gcam5_flip_patch.py
      - patches/gcam5.jks
      - helper/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0 platforms;android-34

      - name: Install Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o /tmp/apktool.jar
          sudo mv /tmp/apktool.jar /usr/local/lib/apktool.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/lib/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool

      - name: Download and verify the ORIGINAL GCam 5.1 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/donquixotezanadha/gcamG6/releases/download/gcamv5/cstark27_GCam_5.1.018_24_v4.2t3.apk" -o original.apk
          echo "b25f3400e48594e83d06ffa10e5aaaa06af9032055bfe1eef72630791f91e028  original.apk" | sha256sum -c

      - name: Build the flip helper (Java to dex)
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          mkdir -p helper-build/classes helper-build/dex
          javac --release 8 -Xlint:-options -cp "$ANDROID_JAR" -d helper-build/classes helper/flip/Helper.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --release --min-api 24 --lib "$ANDROID_JAR" \
            --output helper-build/dex helper-build/classes/flip/*.class
          ls -la helper-build/dex
          test -s helper-build/dex/classes.dex

      - name: Decode original APK (Smali only, original resources untouched)
        run: apktool d -f -r original.apk -o decoded

      - name: Apply selfie flip patch
        run: python3 patches/gcam5_flip_patch.py decoded

      - name: Build APK and add the helper dex
        shell: bash
        run: |
          set -euo pipefail
          apktool b decoded -o unsigned.apk
          mkdir -p inject
          cp helper-build/dex/classes.dex inject/classes2.dex
          (cd inject && zip -q ../unsigned.apk classes2.dex)
          unzip -l unsigned.apk | grep -E 'classes[0-9]*\.dex'
          unzip -p unsigned.apk classes2.dex | head -c 3 | grep -q dex

      - name: Align and sign
        shell: bash
        run: |
          set -euo pipefail
          OUT=GCam5.1-SelfieFlip
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 unsigned.apk $OUT-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks patches/gcam5.jks --ks-key-alias gcam5 --ks-pass pass:gcam5keep --key-pass pass:gcam5keep \
            --out $OUT.apk $OUT-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose $OUT.apk
          sha256sum $OUT.apk
          cp patch-report.txt /tmp/patch-report.txt

      - name: Publish APK to a release (direct download link)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete gcam5-selfie-flip --yes --cleanup-tag || true
          gh release delete gcam5-flip-apk --yes --cleanup-tag || true
          gh release create gcam5-flip-apk GCam5.1-SelfieFlip.apk \
            --title "GCam 5.1 - Selfie Flip" \
            --notes "GCam 5.1.018_24 v4.2t3, one change: selfie (front camera) photos are saved mirrored like the preview. Signed with the fixed gcam5 key, so later builds install over this one." \
            --target "$GITHUB_SHA" \
            --prerelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GCam5.1-SelfieFlip
          path: GCam5.1-SelfieFlip.apk
          if-no-files-found: error
          retention-days: 30

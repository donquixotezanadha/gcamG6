name: NGCam Lite 2 Build 4 - Disable Immersive Mode

on:
  push:
    branches:
      - build-4-no-immersive
    paths:
      - .github/workflows/build-ngcam-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0
      - name: Install Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o /tmp/apktool.jar
          sudo mv /tmp/apktool.jar /usr/local/lib/apktool.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/lib/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
      - name: Download original APK and source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/donquixotezanadha/gcamG6/releases/download/original-v1/NGCam.lite2.apk" -o original.apk
          curl -fL --retry 3 "https://github.com/donquixotezanadha/gcamG6/releases/download/original-v1/NGCam.lite2_src.zip" -o source.zip
          echo "cfb6650043835837e0f89ed2565c3f9df331b8e8f967a61366fe56c5f56f1087  original.apk" | sha256sum -c
          echo "be6a58b98182cdef192cb29850f3d384b4f80fb9cf15d621f7503927354cc449  source.zip" | sha256sum -c
      - name: Decode original APK
        run: apktool d -f -r original.apk -o decoded
      - name: Apply experimental 4K bitrate cap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("decoded/smali/lng.smali")
          s = p.read_text()
          method = ".method public static a(Landroid/media/CamcorderProfile;)Llnf;"
          start = s.find(method)
          if start < 0:
              raise SystemExit("Target CamcorderProfile conversion method not found")
          end = s.find(".end method", start)
          if end < 0:
              raise SystemExit("Target method boundary not found")
          block = s[start:end]
          if "ngcam_v2_bitrate_skip" in block:
              raise SystemExit("Patch already applied")
          if ".locals 2" not in block:
              raise SystemExit("Unexpected local-register layout; refusing unsafe patch")
          needle = "    iget v1, p0, Landroid/media/CamcorderProfile;->videoBitRate:I"
          if block.count(needle) != 1:
              raise SystemExit(f"Expected one videoBitRate read, found {block.count(needle)}")
          block = block.replace(".locals 2", ".locals 4", 1)
          inject = needle + """
          
              # Experimental V2: cap only UHD/4K profile bitrate at 40 Mbps.
              iget v2, p0, Landroid/media/CamcorderProfile;->videoFrameWidth:I
              const/16 v3, 0xf00
              if-lt v2, v3, :ngcam_v2_bitrate_skip
              const v3, 0x2625a00
              if-le v1, v3, :ngcam_v2_bitrate_skip
              move v1, v3
              :ngcam_v2_bitrate_skip"""
          block = block.replace(needle, inject, 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          print("Patched CamcorderProfile conversion: width >= 3840, video bitrate max 40,000,000 bps.")
          PY
      - name: Disable immersive system UI flags only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("decoded")
          patched_calls = 0
          # Patch every Smali View.setSystemUiVisibility call, not just one
          # helper that may be overridden later in the Activity lifecycle.
          for p in root.rglob("*.smali"):
              s = p.read_text(encoding="utf-8")
              lines = s.splitlines()
              out = []
              changed = False
              for line in lines:
                  m = re.search(r'^(\\s*)invoke-virtual(?:/range)? \\{([^}]*)\\}, Landroid/view/View;->setSystemUiVisibility\\(I\\)V', line)
                  if m and not line.strip().startswith("#"):
                      regs = [x.strip() for x in m.group(2).split(",")]
                      if len(regs) == 2:
                          indent = m.group(1)
                          view_reg, flag_reg = regs
                          out.append(f"{indent}const/4 {flag_reg}, 0x0")
                          out.append(f"{indent}invoke-virtual {{{view_reg}, {flag_reg}}}, Landroid/view/View;->setSystemUiVisibility(I)V")
                          patched_calls += 1
                          changed = True
                          continue
                  out.append(line)
              if changed:
                  p.write_text("\\n".join(out) + "\\n", encoding="utf-8")

          if patched_calls == 0:
              raise SystemExit("No View.setSystemUiVisibility calls found; refusing to produce an unpatched APK")

          # Also clear Window.FLAG_FULLSCREEN in the central Window helper.
          p = root / "smali/jve.smali"
          s = p.read_text(encoding="utf-8")
          method = ".method public static a(Landroid/view/Window;)V"
          start = s.find(method)
          end = s.find(".end method", start)
          if start < 0 or end < 0:
              raise SystemExit("Expected central Window helper not found")
          block = s[start:end]
          if "Window;->clearFlags(I)V" not in block:
              anchor = "    invoke-virtual {p0, v1}, Landroid/view/Window;->setFlags(II)V"
              if anchor in block:
                  block = block.replace(anchor, anchor + "\\n    const/16 v1, 0x400\\n    invoke-virtual {p0, v1}, Landroid/view/Window;->clearFlags(I)V", 1)
              else:
                  # Insert clearFlags before the helper returns, using v1 as its local scratch register.
                  ret = "    return-void"
                  if ret not in block:
                      raise SystemExit("No safe return anchor in central Window helper")
                  block = block.replace(ret, "    const/16 v1, 0x400\\n    invoke-virtual {p0, v1}, Landroid/view/Window;->clearFlags(I)V\\n" + ret, 1)
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding="utf-8")

          report = Path("patch-report.txt")
          with report.open("a", encoding="utf-8") as f:
              f.write(f"\\nBuild 4 only: disabled immersive UI flags at {patched_calls} View.setSystemUiVisibility call sites; clear Window.FLAG_FULLSCREEN in central helper.\\n")
          print(f"Patched {patched_calls} system UI visibility call sites; no Lite UI/default tuning changes applied.")
          PY

      - name: Build APK
        run: apktool b decoded -o unsigned.apk
      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore test-signing.jks -storepass ngcamv4temp -keypass ngcamv4temp -alias ngcamv4 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NGCam Build 4 No Immersive"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 unsigned.apk NGCam-Lite2-Build4-No-Immersive-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks test-signing.jks --ks-pass pass:ngcamv4temp --key-pass pass:ngcamv4temp --out NGCam-Lite2-Build4-No-Immersive.apk NGCam-Lite2-Build4-No-Immersive-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose NGCam-Lite2-Build4-No-Immersive.apk
          sha256sum NGCam-Lite2-Build4-No-Immersive.apk > SHA256SUMS.txt
          {
            echo "NGCam Lite 2 V2 experimental build"
            echo "Patch: cap CamcorderProfile video bitrate to 40 Mbps when videoFrameWidth >= 3840."
            echo "Purpose: test whether an excessive 4K profile bitrate contributes to MediaRecorder start failure."
            echo "Caveat: experimental; not confirmed on LG G6 hardware. Signed with a new test key, so it cannot update an APK signed with the original key; uninstall the old package before installing only if you accept that."
            echo
            cat SHA256SUMS.txt
          } > BUILD-NOTES.txt
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: NGCam-Lite2-Build4-No-Immersive
          path: |
            NGCam-Lite2-Build4-No-Immersive.apk
            BUILD-NOTES.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

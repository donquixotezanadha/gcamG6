name: NGCam Lite 2 Build 3 - Lite UI

on:
  push:
    branches:
      - build-3-lite-ui
    paths:
      - .github/workflows/build-ngcam-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0

      - name: Install Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o /tmp/apktool.jar
          sudo mv /tmp/apktool.jar /usr/local/lib/apktool.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/lib/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool

      - name: Download and verify Build 2 baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/donquixotezanadha/gcamG6/releases/download/original-v1/NGCam.lite2.apk" -o original.apk
          curl -fL --retry 3 "https://github.com/donquixotezanadha/gcamG6/releases/download/original-v1/NGCam.lite2_src.zip" -o source.zip
          echo "cfb6650043835837e0f89ed2565c3f9df331b8e8f967a61366fe56c5f56f1087  original.apk" | sha256sum -c
          echo "be6a58b98182cdef192cb29850f3d384b4f80fb9cf15d621f7503927354cc449  source.zip" | sha256sum -c
          echo "Baseline APK and source archive checksums verified." | tee patch-report.txt

      - name: Decode APK while preserving original resources
        run: apktool d -f -r original.apk -o decoded

      - name: Apply Lite UI, default camera tuning, and visible system bars
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("decoded")
          report = []

          # 1) Hide only the requested mod-specific settings from the settings UI.
          # Resource table/XML remains byte-for-byte original; removal is done
          # against PreferenceGroups after camera_preferences is inflated.
          ehf = root / "smali/ehf.smali"
          s = ehf.read_text(encoding="utf-8")
          if "applyLiteUi()V" in s:
              raise SystemExit("Lite UI patch already present in ehf.smali")
          inflate = "    invoke-virtual {v0, v3}, Lehf;->addPreferencesFromResource(I)V"
          if s.count(inflate) != 1:
              raise SystemExit(f"Expected one preference inflation call, found {s.count(inflate)}")
          s = s.replace(inflate, inflate + "\n\n    invoke-direct {p0}, Lehf;->applyLiteUi()V", 1)
          s += """

          .method private final removeLitePreference(Landroid/preference/PreferenceGroup;Ljava/lang/String;)V
              .locals 1
              invoke-virtual {p1, p2}, Landroid/preference/PreferenceGroup;->findPreference(Ljava/lang/CharSequence;)Landroid/preference/Preference;
              move-result-object v0
              if-eqz v0, :lite_remove_done
              invoke-virtual {p1, v0}, Landroid/preference/PreferenceGroup;->removePreference(Landroid/preference/Preference;)Z
              :lite_remove_done
              return-void
          .end method

          .method private final applyLiteUi()V
              .locals 3
              invoke-virtual {p0}, Lehf;->getPreferenceScreen()Landroid/preference/PreferenceScreen;
              move-result-object v0
              if-eqz v0, :lite_ui_done

              const-string v1, "pref_category_advanced"
              invoke-virtual {v0, v1}, Landroid/preference/PreferenceGroup;->findPreference(Ljava/lang/CharSequence;)Landroid/preference/Preference;
              move-result-object v1
              if-eqz v1, :lite_ui_resolution
              check-cast v1, Landroid/preference/PreferenceGroup;
              const-string v2, "pref_category_nikita"
              invoke-virtual {v1, v2}, Landroid/preference/PreferenceGroup;->findPreference(Ljava/lang/CharSequence;)Landroid/preference/Preference;
              move-result-object v2
              if-eqz v2, :lite_ui_resolution
              check-cast v2, Landroid/preference/PreferenceGroup;

              const-string v1, "pref_category_exposure_comp"
              invoke-direct {p0, v2, v1}, Lehf;->removeLitePreference(Landroid/preference/PreferenceGroup;Ljava/lang/String;)V
              const-string v1, "screen_aemode_key"
              invoke-direct {p0, v2, v1}, Lehf;->removeLitePreference(Landroid/preference/PreferenceGroup;Ljava/lang/String;)V
              const-string v1, "pref_shasta_key"
              invoke-direct {p0, v2, v1}, Lehf;->removeLitePreference(Landroid/preference/PreferenceGroup;Ljava/lang/String;)V
              const-string v1, "pref_focus_settings_key"
              invoke-direct {p0, v2, v1}, Lehf;->removeLitePreference(Landroid/preference/PreferenceGroup;Ljava/lang/String;)V

              :lite_ui_resolution
              const-string v1, "pref_category_resolution_camera"
              invoke-virtual {v0, v1}, Landroid/preference/PreferenceGroup;->findPreference(Ljava/lang/CharSequence;)Landroid/preference/Preference;
              move-result-object v1
              if-eqz v1, :lite_ui_done
              check-cast v1, Landroid/preference/PreferenceGroup;
              const-string v2, "lib_group_key"
              invoke-direct {p0, v1, v2}, Lehf;->removeLitePreference(Landroid/preference/PreferenceGroup;Ljava/lang/String;)V
              const-string v2, "pref_frames_key"
              invoke-direct {p0, v1, v2}, Lehf;->removeLitePreference(Landroid/preference/PreferenceGroup;Ljava/lang/String;)V

              :lite_ui_done
              return-void
          .end method
          """
          ehf.write_text(s, encoding="utf-8")
          report.append("Lite UI: hide Lib Patcher, HDR+ Enhanced Frames, Exposure Compensation, ISO/Exposure Time, Shasta Factor, and manual-focus options.")

          # 2) Apply the selected model/noise/black-level defaults once at camera
          # startup, before camera tuning reads the shared preferences.
          fix = root / "smali_classes2/com/FixBSG.smali"
          fs = fix.read_text(encoding="utf-8")
          if "applyLiteDefaults()V" in fs:
              raise SystemExit("Lite defaults patch already present in FixBSG.smali")
          fs += """

          .method public static applyLiteDefaults()V
              .locals 4
              invoke-static {}, Landroid/app/AppGlobals;->getInitialApplication()Landroid/app/Application;
              move-result-object v0
              if-eqz v0, :lite_defaults_done
              invoke-static {v0}, Landroid/preference/PreferenceManager;->getDefaultSharedPreferences(Landroid/content/Context;)Landroid/content/SharedPreferences;
              move-result-object v0
              const-string v1, "ngcam_lite_ui_defaults_v3_applied"
              const/4 v2, 0x0
              invoke-interface {v0, v1, v2}, Landroid/content/SharedPreferences;->getBoolean(Ljava/lang/String;Z)Z
              move-result v2
              if-nez v2, :lite_defaults_done
              invoke-interface {v0}, Landroid/content/SharedPreferences;->edit()Landroid/content/SharedPreferences$Editor;
              move-result-object v1

              const-string v2, "pref_model_back_key"
              const-string v3, "7"
              invoke-interface {v1, v2, v3}, Landroid/content/SharedPreferences$Editor;->putString(Ljava/lang/String;Ljava/lang/String;)Landroid/content/SharedPreferences$Editor;
              const-string v2, "pref_model_front_key"
              const-string v3, "7"
              invoke-interface {v1, v2, v3}, Landroid/content/SharedPreferences$Editor;->putString(Ljava/lang/String;Ljava/lang/String;)Landroid/content/SharedPreferences$Editor;

              const-string v2, "pref_noise_modeler_main_key"
              const-string v3, "IMX363_GOOGLE"
              invoke-interface {v1, v2, v3}, Landroid/content/SharedPreferences$Editor;->putString(Ljava/lang/String;Ljava/lang/String;)Landroid/content/SharedPreferences$Editor;
              const-string v2, "pref_noise_modeler_front_key"
              const-string v3, "IMX363_GOOGLE"
              invoke-interface {v1, v2, v3}, Landroid/content/SharedPreferences$Editor;->putString(Ljava/lang/String;Ljava/lang/String;)Landroid/content/SharedPreferences$Editor;

              const-string v2, "pref_noise_modeler_toggle_back_key"
              const/4 v3, 0x1
              invoke-interface {v1, v2, v3}, Landroid/content/SharedPreferences$Editor;->putBoolean(Ljava/lang/String;Z)Landroid/content/SharedPreferences$Editor;
              const-string v2, "pref_noise_modeler_toggle_front_key"
              const/4 v3, 0x1
              invoke-interface {v1, v2, v3}, Landroid/content/SharedPreferences$Editor;->putBoolean(Ljava/lang/String;Z)Landroid/content/SharedPreferences$Editor;

              const-string v2, "pref_blacklevel_back_key"
              const-string v3, "65"
              invoke-interface {v1, v2, v3}, Landroid/content/SharedPreferences$Editor;->putString(Ljava/lang/String;Ljava/lang/String;)Landroid/content/SharedPreferences$Editor;
              const-string v2, "pref_blacklevel_front_key"
              const-string v3, "65"
              invoke-interface {v1, v2, v3}, Landroid/content/SharedPreferences$Editor;->putString(Ljava/lang/String;Ljava/lang/String;)Landroid/content/SharedPreferences$Editor;

              const-string v2, "ngcam_lite_ui_defaults_v3_applied"
              const/4 v3, 0x1
              invoke-interface {v1, v2, v3}, Landroid/content/SharedPreferences$Editor;->putBoolean(Ljava/lang/String;Z)Landroid/content/SharedPreferences$Editor;
              invoke-interface {v1}, Landroid/content/SharedPreferences$Editor;->apply()V
              :lite_defaults_done
              return-void
          .end method
          """
          fix.write_text(fs, encoding="utf-8")
          report.append("Defaults: Pixel 3 XL model 7 front/rear; Google IMX363 Noise Modeler enabled front/rear; Black Level 65 front/rear (applied once).")

          # Call defaults as early as possible in the camera activity lifecycle.
          activity = root / "smali/com/google/android/apps/camera/legacy/app/activity/main/CameraActivity.smali"
          a = activity.read_text(encoding="utf-8")
          super_call = "    invoke-super {p0, p1}, Ldwg;->onCreate(Landroid/os/Bundle;)V"
          if a.count(super_call) != 1:
              raise SystemExit(f"Expected one CameraActivity onCreate super call, found {a.count(super_call)}")
          a = a.replace(super_call, super_call + "\n    invoke-static {}, Lcom/FixBSG;->applyLiteDefaults()V", 1)
          activity.write_text(a, encoding="utf-8")
          report.append("Defaults initializer called from CameraActivity.onCreate.")

          # 3) Disable immersive/fullscreen flags on the camera window.
          jve = root / "smali/jve.smali"
          s = jve.read_text(encoding="utf-8")
          method = ".method public static a(Landroid/view/Window;)V"
          start = s.find(method)
          end = s.find(".end method", start)
          if start < 0 or end < 0:
              raise SystemExit("Window system-UI method boundary not found")
          block = s[start:end]
          if block.count("const/16 v1, 0x705") != 1:
              raise SystemExit("Expected one 0x705 system-UI flag constant")
          block = block.replace("const/16 v1, 0x705", "const/4 v1, 0x0", 1)
          set_ui = "    invoke-virtual {v0, v1}, Landroid/view/View;->setSystemUiVisibility(I)V"
          if block.count(set_ui) != 1:
              raise SystemExit("Expected one setSystemUiVisibility call in window helper")
          block = block.replace(set_ui, set_ui + "\n\n    const/16 v1, 0x400\n    invoke-virtual {p0, v1}, Landroid/view/Window;->clearFlags(I)V", 1)
          jve.write_text(s[:start] + block + s[end:], encoding="utf-8")
          report.append("Immersive mode: clear decor visibility flags and Window FLAG_FULLSCREEN so status/navigation bars can remain visible.")

          # 4) Keep Build 2's experimental 4K bitrate cap as-is for this UI-only build.
          lng = root / "smali/lng.smali"
          s = lng.read_text(encoding="utf-8")
          method = ".method public static a(Landroid/media/CamcorderProfile;)Llnf;"
          start = s.find(method)
          end = s.find(".end method", start)
          if start < 0 or end < 0:
              raise SystemExit("Target CamcorderProfile conversion method not found")
          block = s[start:end]
          if "ngcam_v2_bitrate_skip" in block:
              raise SystemExit("4K bitrate patch already present in baseline")
          if ".locals 2" not in block:
              raise SystemExit("Unexpected CamcorderProfile register layout")
          needle = "    iget v1, p0, Landroid/media/CamcorderProfile;->videoBitRate:I"
          if block.count(needle) != 1:
              raise SystemExit("Expected one videoBitRate read in CamcorderProfile conversion")
          block = block.replace(".locals 2", ".locals 4", 1)
          inject = needle + """
              # Build 2 experiment: cap UHD/4K profile bitrate at 40 Mbps.
              iget v2, p0, Landroid/media/CamcorderProfile;->videoFrameWidth:I
              const/16 v3, 0xf00
              if-lt v2, v3, :ngcam_v2_bitrate_skip
              const v3, 0x2625a00
              if-le v1, v3, :ngcam_v2_bitrate_skip
              move v1, v3
              :ngcam_v2_bitrate_skip"""
          block = block.replace(needle, inject, 1)
          lng.write_text(s[:start] + block + s[end:], encoding="utf-8")
          report.append("4K: retained experimental 40 Mbps cap for UHD profiles; force-close remains unresolved.")

          Path("patch-report.txt").write_text("\n".join(report) + "\n", encoding="utf-8")
          print("\n".join(report))
          PY

      - name: Build APK
        run: apktool b decoded -o unsigned.apk

      - name: Align, sign, and verify APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore test-signing.jks -storepass ngcamv3temp -keypass ngcamv3temp -alias ngcamv3 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NGCam Lite 2 Build 3"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 unsigned.apk NGCam-Lite2-Build3-LiteUI-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks test-signing.jks --ks-pass pass:ngcamv3temp --key-pass pass:ngcamv3temp --out NGCam-Lite2-Build3-LiteUI.apk NGCam-Lite2-Build3-LiteUI-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose NGCam-Lite2-Build3-LiteUI.apk
          sha256sum NGCam-Lite2-Build3-LiteUI.apk > SHA256SUMS.txt
          stat -c 'APK size: %s bytes' NGCam-Lite2-Build3-LiteUI.apk | tee -a patch-report.txt
          cat SHA256SUMS.txt >> patch-report.txt

      - name: Upload Build 3 APK
        uses: actions/upload-artifact@v4
        with:
          name: NGCam-Lite2-Build3-LiteUI
          path: |
            NGCam-Lite2-Build3-LiteUI.apk
            patch-report.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NGCam-Lite2-Build3-LiteUI-diagnostics
          path: |
            patch-report.txt
            decoded/res/xml/camera_preferences.xml
            decoded/res/values/styles.xml
          if-no-files-found: warn
          retention-days: 14
